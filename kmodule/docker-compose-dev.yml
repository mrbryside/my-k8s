version: "3.8"

services:
  kserver:
    container_name: kserver
    build:
      context: .
      dockerfile: ./kserver/Dockerfile.dev
    volumes:
      - ./:/src/go
    ports:
      - 8080:8080
    env_file:
      - ./kserver/.env.common
    working_dir: /src/go/kserver
    command: air -c .air.toml
    depends_on:
      - etcd

  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: etcd
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
    ports:
      - "2379:2379"

  etcdkeeper:
    image: evildecay/etcdkeeper
    container_name: etcdkeeper
    ports:
      - "9090:8080"
    environment:
      - ETCD_HOST=http://etcd:2379
    depends_on:
      - etcd
